    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
<style>
  :root {
    --bg: #fff;
    --side: #f7f7f7;
    --hover: #eee;
    --sel: #e8f0fe;
    --sel-text: #174ea6;
    --line: #dadce0;
    --text: #202124;
    --muted: #5f6368;
    --url: #188038;
    --star: #f9ab00;
    --side-w: 280px;
  }
  html[data-theme="dark"] {
    --bg: #292a2d;
    --side: #202124;
    --hover: #3c4043;
    --sel: #394457;
    --sel-text: #8ab4f8;
    --line: #3c4043;
    --text: #e8eaed;
    --muted: #9aa0a6;
    --url: #81c995;
    --star: #fdd663;
  }
  html[data-theme="light"] {
    --bg: #fff;
    --side: #f7f7f7;
    --hover: #eee;
    --sel: #e8f0fe;
    --sel-text: #174ea6;
    --line: #dadce0;
    --text: #202124;
    --muted: #5f6368;
    --url: #188038;
    --star: #f9ab00;
  }
  @media (prefers-color-scheme: dark) {
    html:not([data-theme]) {
      --bg: #292a2d;
      --side: #202124;
      --hover: #3c4043;
      --sel: #394457;
      --sel-text: #8ab4f8;
      --line: #3c4043;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --url: #81c995;
      --star: #fdd663;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 13px/1.4 "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .layout {
    display: grid;
    grid-template-columns: var(--side-w) 1fr;
    height: 100vh;
  }
  .side {
    background: var(--side);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .side-top {
    padding: 12px 12px 8px;
    border-bottom: 1px solid var(--line);
  }
  .side-top h1 {
    margin: 0 0 8px;
    font-size: 16px;
    font-weight: 500;
  }
  .side-top input {
    width: 100%;
    height: 32px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--bg);
    outline: none;
  }
  .side-top input:focus { border-color: #8ab4f8; }
  .folders {
    flex: 1;
    overflow: auto;
    padding: 8px 0 16px;
  }
  .folder {
    width: calc(100% - 8px);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px 7px 10px;
    border: 0;
    background: transparent;
    text-align: left;
    color: var(--text);
    border-radius: 0 16px 16px 0;
  }
  .folder:hover { background: var(--hover); }
  .folder.on {
    background: var(--sel);
    color: var(--sel-text);
  }
  .folder svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }
  .folder .label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .folder .n {
    color: var(--muted);
    font-size: 11px;
  }
  .folder.on .n { color: inherit; opacity: 0.8; }
  .sub {
    list-style: none;
    margin: 0;
    padding: 0 0 6px;
  }
  .sub button {
    width: calc(100% - 8px);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px 5px 36px;
    border: 0;
    background: transparent;
    text-align: left;
    color: var(--text);
    border-radius: 0 16px 16px 0;
  }
  .sub button:hover { background: var(--hover); }
  .sub button.on {
    background: var(--sel);
    color: var(--sel-text);
  }
  .sub .label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sub .n { color: var(--muted); font-size: 11px; }
  .side-bot {
    padding: 8px 12px;
    border-top: 1px solid var(--line);
    font-size: 11px;
    color: var(--muted);
  }
  .side-bot a { color: var(--muted); }

  .main {
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow: hidden;
  }
  .bar {
    height: 48px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px;
    border-bottom: 1px solid var(--line);
  }
  .bar h2 {
    margin: 0;
    font-size: 14px;
    font-weight: 500;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bar .count { color: var(--muted); font-weight: 400; font-size: 12px; }
  .bar button {
    height: 28px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--bg);
    color: var(--muted);
  }
  .bar button.on {
    background: var(--sel);
    border-color: transparent;
    color: var(--sel-text);
  }

  .table-wrap { flex: 1; overflow: auto; }
  table { width: 100%; border-collapse: collapse; }
  th {
    position: sticky;
    top: 0;
    z-index: 1;
    background: var(--bg);
    text-align: left;
    font-weight: 500;
    font-size: 12px;
    color: var(--muted);
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
  }
  td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }
  tr:hover td { background: var(--hover); }
  .name-cell {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 160px;
  }
  .name-cell img {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }
  .name-cell a {
    color: var(--text);
    text-decoration: none;
    font-weight: 500;
  }
  .name-cell a:hover { text-decoration: underline; }
  .blurb { color: var(--muted); }
  .url a {
    color: var(--url);
    text-decoration: none;
    font-size: 12px;
  }
  .url a:hover { text-decoration: underline; }
  .kind {
    font-size: 11px;
    white-space: nowrap;
    color: var(--muted);
  }
  .kind b {
    font-weight: 500;
    color: var(--text);
  }
  .bar select {
    height: 28px;
    padding: 0 8px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--bg);
    color: var(--muted);
    outline: none;
  }
  .star {
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    padding: 0 4px;
  }
  .star.on { color: var(--star); }
  .star:focus-visible,
  .folder:focus-visible,
  .sub button:focus-visible,
  .bar button:focus-visible,
  .bar select:focus-visible,
  .side-top input:focus-visible {
    outline: 2px solid var(--sel-text);
    outline-offset: 2px;
  }
  .empty {
    padding: 48px 16px;
    text-align: center;
    color: var(--muted);
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  .skip {
    position: absolute;
    left: -9999px;
    top: 8px;
    z-index: 10;
    padding: 8px 12px;
    background: var(--sel);
    color: var(--sel-text);
    border-radius: 8px;
    text-decoration: none;
  }
  .skip:focus { left: 8px; }
  .toast {
    position: fixed;
    bottom: 16px;
    right: 16px;
    max-width: 320px;
    padding: 10px 14px;
    border-radius: 10px;
    background: var(--sel);
    color: var(--sel-text);
    border: 1px solid var(--line);
    box-shadow: 0 4px 16px rgba(0,0,0,.18);
    font-size: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  .toast.show { opacity: 1; }
  .help-pop {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(0,0,0,.35);
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .help-pop.open { display: flex; }
  .help-card {
    width: min(420px, 100%);
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px;
  }
  .help-card h3 { margin: 0 0 10px; font-size: 15px; font-weight: 600; }
  .help-card dl { margin: 0; display: grid; grid-template-columns: 72px 1fr; gap: 6px 10px; font-size: 12px; }
  .help-card dt {
    font-family: ui-monospace, Consolas, monospace;
    color: var(--sel-text);
  }
  .help-card dd { margin: 0; color: var(--muted); }
  .help-card .close {
    margin-top: 14px;
    height: 28px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--bg);
    color: var(--muted);
  }
  .bar .icon-btn { min-width: 28px; padding: 0 10px; }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .side { display: none; }
    th:nth-child(3), td:nth-child(3),
    th:nth-child(4), td:nth-child(4) { display: none; }
  }
</style>
</head>

<a class="skip" href="#q">Skip to search</a>
<div class="layout">
  <aside class="side" aria-label="Folders">
    <div class="side-top">
      <h1>Bookmarks</h1>
      <input id="q" type="search" placeholder="Search bookmarks" autocomplete="off" spellcheck="false" aria-label="Search bookmarks" aria-keyshortcuts="/">
    </div>
    <nav class="folders" id="folders" aria-label="Bookmark folders"></nav>
    <div class="side-bot">
      <div style="margin-bottom:6px">Press <kbd>?</kbd> for shortcuts</div>
      <a href="https://github.com/Chick3nHawk01/Open_Source-CTI-Tooling" target="_blank" rel="noopener">Chick3nHawk01 / Open_Source-CTI-Tooling</a>
    </div>
  </aside>
  <section class="main" aria-label="Bookmark results">
    <div class="bar">
      <h2 id="title">All bookmarks</h2>
      <span id="status" class="sr-only" role="status" aria-live="polite"></span>
      <select id="kindFilter" title="Filter by how you use it" aria-label="Use-for filter">
        <option value="all">All types</option>
      </select>
      <button type="button" id="exportBtn" class="icon-btn" title="Export starred bookmarks as JSON">Export</button>
      <button type="button" id="importBtn" class="icon-btn" title="Import starred bookmarks from JSON">Import</button>
      <input id="importFile" type="file" accept="application/json,.json" hidden aria-hidden="true">
      <button type="button" id="themeBtn" title="Toggle light / dark (d)" aria-keyshortcuts="d">Light</button>
      <button type="button" id="starredBtn" title="Show starred only (s)" aria-keyshortcuts="s" aria-pressed="false">Starred</button>
      <button type="button" id="helpBtn" class="icon-btn" title="Keyboard shortcuts (?)" aria-haspopup="dialog">?</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:26%" scope="col">Name</th>
            <th scope="col">Description</th>
            <th style="width:20%" scope="col">URL</th>
            <th style="width:88px" scope="col">Use for</th>
            <th style="width:36px" scope="col"><span class="sr-only">Star</span></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden>No bookmarks match.</div>
    </div>
  </section>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="helpPop" class="help-pop" role="dialog" aria-modal="true" aria-labelledby="helpTitle" hidden>
  <div class="help-card">
    <h3 id="helpTitle">Keyboard shortcuts</h3>
    <dl>
      <dt>/</dt><dd>Focus search</dd>
      <dt>Esc</dt><dd>Clear search / close help</dd>
      <dt>d</dt><dd>Toggle light / dark theme</dd>
      <dt>s</dt><dd>Toggle starred-only view</dd>
      <dt>?</dt><dd>Show this help</dd>
    </dl>
    <button type="button" class="close" id="helpClose">Close</button>
  </div>
</div>

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function hasWord(hay, words) {
  return words.some(w => {
    const re = new RegExp(`(?:^|[^a-z0-9])${w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}(?:[^a-z0-9]|$)`);
    return re.test(hay);
  });
}

function kindOf(link) {
  const host = (link.host || "").toLowerCase();
  const url = (link.url || "").toLowerCase();
  const folder = (link.category || "").toLowerCase();
  const pillar = (link.pillar || "").toLowerCase();
  const name = (link.name || "").toLowerCase();
  const blurb = (link.blurb || "").toLowerCase();
  const hay = `${name} ${blurb} ${folder} ${host}`;

  function hostHit(list) {
    return list.some(h => host === h || host.endsWith("." + h));
  }

  // High-confidence hosts first
  const hosts = {
    enrich: ["virustotal.com","abuseipdb.com","urlscan.io","urlvoid.com","ipvoid.com","greynoise.io","pulsedive.com","opentip.kaspersky.com","threatminer.org","talosintelligence.com","spamhaus.org","scamadviser.com","ipqualityscore.com","polyswarm.io","metadefender.opswat.com","filescan.io","intezer.com","emailrep.io","haveibeenpwned.com","dehashed.com","intelx.io","hunter.io","snov.io","clearbit.com","dnslytics.com","mxtoolbox.com","whatismyipaddress.com","ipinfo.io","db-ip.com","transparencyreport.google.com","exchange.xforce.ibmcloud.com","platform.socradar.com","threatbook.io","alienvault.com"],
    sandbox: ["any.run","tria.ge","joesandbox.com","app.any.run","threatfeed.vmray.com","dracoeye.com","hybrid-analysis.com","labs.inquest.net","capesandbox.com","cuckoo.cert.ee"],
    infra: ["shodan.io","censys.io","securitytrails.com","crt.sh","dnsdumpster.com","viewdns.info","robtex.com","bgp.he.net","bgp.tools","passivedns.mnemonic.no","validin.com","silentpush.com","who.is","whoxy.com","ssllabs.com","fofa.info","netlas.io","publicwww.com","radar.cloudflare.com","cdnplanet.com","builtwith.com","wappalyzer.com","fullhunt.io","binaryedge.io","zoomeye.org","hunter.how","onyphe.io","spyse.com","domaintools.com","portquiz.net","requestinspector.com","securityheaders.com"],
    feed: ["abuse.ch","threatfox.abuse.ch","urlhaus.abuse.ch","feodotracker.abuse.ch","sslbl.abuse.ch","bazaar.abuse.ch","hunting.abuse.ch","ransomware.live","ransomwatch.telemetry.ltd","ransomlook.io","ransom.wiki","otx.alienvault.com","openphish.com","phishtank.com"],
    actor: ["adversary.crowdstrike.com","apt.etda.or.th","malpedia.caad.fkie.fraunhofer.de"],
    vuln: ["nvd.nist.gov","cve.org","cwe.mitre.org","exploit-db.com","vulners.com","vuldb.com","osv.dev","opencve.io","cvecrowd.com","zerodayinitiative.com","msrc.microsoft.com","first.org","kev.circl.lu","epss.cyentia.com"],
    detect: ["sigmahq.io","atomicredteam.io","suricata.io","yara.readthedocs.io","car.mitre.org","threathunterplaybook.com","zeek.org","canarytokens.org","gtfobins.github.io","lolbas-project.github.io","hijacklibs.net","filesec.io","wadcoms.github.io","circl.lu","threatnote.io","misp-project.org"],
    tip: ["misp-project.org","filigran.io","thehive-project.org","yeti-platform.io"],
    spec: ["attack.mitre.org","oasis-open.github.io","docs.oasis-open.org","nist.gov","cisecurity.org","d3fend.mitre.org","capec.mitre.org","engage.mitre.org","verisframework.org"],
    report: ["securelist.com","research.checkpoint.com","welivesecurity.com","blog.malwarebytes.com","krebsonsecurity.com","thehackernews.com","bleepingcomputer.com","darkreading.com","unit42.paloaltonetworks.com","blog.talosintelligence.com","elastic.co"],
    lab: ["ctftime.org","picoctf.org","overthewire.org","hacker101.com","tryhackme.com","hackthebox.com","pentesterlab.com","cyberdefenders.org","letsdefend.io"],
    osint: ["whatsmyname.app","namechk.com","osintframework.com","osintcombine.com","inteltechniques.com","social-searcher.com","pipl.com","spokeo.com","truepeoplesearch.com","wigle.net","radarbox24.com","flightaware.com","planefinder.net","ads-b.nl"],
  };

  for (const [k, list] of Object.entries(hosts)) {
    if (hostHit(list)) {
      if (k === "tip") return "detect";
      return k;
    }
  }

  if (host === "github.com" || host.endsWith(".github.io") || url.includes("github.com/")) {
    if (hasWord(hay, ["sigma","yara","detection","hunt","atomic","rule","lolbas","gtfo"])) return "detect";
    if (hasWord(hay, ["apt","actor","ransomware","matrix","alias","threat-matrix"])) return "actor";
    if (hasWord(hay, ["osint","recon","username"])) return "osint";
    if (hasWord(hay, ["cve","exploit","vuln"])) return "vuln";
    return "code";
  }

  // Folder signals: category only (never whole OSINT pillar)
  if (/sandbox|malware analysis|sample|detonat/.test(folder)) return "sandbox";
  if (/file & malware/.test(folder) && hasWord(hay, ["sandbox","detonate","sample","triage","bazaar","malshare"])) return "sandbox";
  if (/ip, url|domain analysis|email security|phishing|reputation|hash/.test(folder)) return "enrich";
  if (/dns|certificate|scanning|attack surface|web & network|whois|bgp|asn|passive dns/.test(folder)) return "infra";
  if (/ioc|feed|ransomware intelligence|blocklist|leak/.test(folder)) return "feed";
  if (/adversary|actor|apt group|threat group|malpedia/.test(folder)) return "actor";
  if (/detection|hunting|sigma|yara|siem|ttp & technique|lolbas|gtfo|purple team/.test(folder)) return "detect";
  if (/vulnerabilit|exploit|cve|kev|patch/.test(folder)) return "vuln";
  if (/training|ctf|lab|learning|skill|course/.test(folder)) return "lab";
  if (/framework|standard|governance|stix|taxii|att&ck|methodology|compliance/.test(folder)) return "spec";
  // OSINT folders before generic news/blog (OSINT has many "News Topics" folders)
  if (/social media|people search|persona|username|breach|dark web|image|sat |geo|mapping|flight|vessel|vehicle|country specific|area & event|news topics|academic sources|transport|wireless|radio|camera/.test(folder)) return "osint";
  if (/news|blog|report|vendor threat|monthly threat|situational|geopolitic|advisory/.test(folder)) return "report";
  if (/tip|threat intelligence platform|reporting/.test(folder)) return "detect";

  // Content signals (word boundaries; avoid "reporter" matching "report")
  if (hasWord(hay, ["sandbox","detonate","malware sample","any.run","triage"])) return "sandbox";
  if (hasWord(hay, ["blocklist","ioc feed","threat feed","leak site","ransomware claim"])) return "feed";
  if (hasWord(hay, ["cve","cvss","exploit-db","epss","patch","vulnerability"])) return "vuln";
  if (hasWord(hay, ["att&ck","d3fend","stix","taxii","nist","framework","kill chain","capec"])) return "spec";
  if (hasWord(hay, ["sigma","yara","detection rule","hunt query","atomic red","lolbas","gtfobins"])) return "detect";
  if (hasWord(hay, ["threat actor","apt group","adversary profile","actor alias"])) return "actor";
  if (hasWord(hay, ["passive dns","certificate transparency","asn","bgp","subdomain","shodan","censys","cdn","port test"])) return "infra";
  if (hasWord(hay, ["reputation","abuse score","multi-av","url scan","whois lookup","hash lookup","safe browsing","x-force"])) return "enrich";
  if (hasWord(hay, ["username","sock puppet","breach check","people search","flight tracker","vessel","satellite"])) return "osint";
  if (hasWord(hay, ["ctf","training","lab exercise","certification study","tryhackme","hackthebox"])) return "lab";
  if (hasWord(hay, ["threat report","weekly threat","blog post","news coverage","advisory","security blog"])) return "report";
  if (hasWord(hay, ["code search","source code","grep.app","searchcode"])) return "code";

  // Pillar fallbacks last
  if (/training|ctf/.test(pillar)) return "lab";
  if (/penetration|reverse engineering/.test(pillar)) return "detect";
  if (/technical resources/.test(pillar)) return "spec";
  if (/threat hunting|dfir/.test(pillar)) return "detect";
  if (/web & network/.test(pillar)) return "infra";
  if (/ip, url|email|file & malware/.test(pillar)) return "enrich";
  if (/cyber threat intelligence/.test(pillar)) {
    if (/blog|monthly|report|news|situational|geopolitic/.test(folder)) return "report";
    return "enrich";
  }
  if (/open source intelligence|osint/.test(pillar)) return "osint";

  return "enrich";
}

function flat() {
  const out = [];
  DATA.forEach((p, pi) => {
    p.categories.forEach((c, ci) => {
      c.links.forEach(l => {
        const row = { ...l, pillar: p.name, category: c.name, pi, ci };
        row.kind = kindOf(row);
        out.push(row);
      });
    });
  });
  return out;
}

function saveFavs() {
  localStorage.setItem(FAV_KEY, JSON.stringify([...state.favs]));
}

function favicon(host, url) {
  let d = host;
  if (!d) {
    try { d = new URL(url).hostname; } catch { d = ""; }
  }
  if (!d) return "";
  return "https://www.google.com/s2/favicons?domain=" + encodeURIComponent(d) + "&sz=32";
}

function folderIcon() {
  return '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>';
}

function match(link) {
  if (state.starred && !state.favs.has(link.url)) return false;
  if (state.kind !== "all" && link.kind !== state.kind) return false;
  if (state.pillar !== "all" && link.pillar !== state.pillar) return false;
  if (state.cat) {
    const [pi, ci] = state.cat.split(":").map(Number);
    if (link.pi !== pi || link.ci !== ci) return false;
  }
  const q = state.q.trim().toLowerCase();
  if (!q) return true;
  const meta = KIND_META[link.kind];
  const hay = [link.name, link.blurb, link.host, link.url, link.category, link.pillar, link.kind, meta?.label, meta?.tip].join(" ").toLowerCase();
  return q.split(/\s+/).every(t => hay.includes(t));
}

function renderFolders() {
  const el = document.getElementById("folders");
  const total = flat().length;
  let html = `<button type="button" class="folder ${state.pillar === "all" && !state.cat ? "on" : ""}" data-all="1">${folderIcon()}<span class="label">All bookmarks</span><span class="n">${total}</span></button>`;
  DATA.forEach((p, pi) => {
    const n = p.categories.reduce((a, c) => a + c.links.length, 0);
    const open = state.pillar === p.name;
    html += `<div>
      <button type="button" class="folder ${open && !state.cat ? "on" : ""}" data-pillar="${esc(p.name)}">${folderIcon()}<span class="label">${esc(p.name)}</span><span class="n">${n}</span></button>`;
    if (open) {
      html += "<ul class=\"sub\">" + p.categories.map((c, ci) =>
        `<li><button type="button" class="${state.cat === pi + ":" + ci ? "on" : ""}" data-cat="${pi}:${ci}"><span class="label">${esc(c.name)}</span><span class="n">${c.links.length}</span></button></li>`
      ).join("") + "</ul>";
    }
    html += "</div>";
  });
  el.innerHTML = html;
  el.querySelector("[data-all]")?.addEventListener("click", () => { state.pillar = "all"; state.cat = null; paint(); });
  el.querySelectorAll("[data-pillar]").forEach(btn => btn.addEventListener("click", () => {
    state.pillar = btn.dataset.pillar; state.cat = null; paint();
  }));
  el.querySelectorAll("[data-cat]").forEach(btn => btn.addEventListener("click", () => {
    state.cat = btn.dataset.cat;
    state.pillar = DATA[+state.cat.split(":")[0]].name;
    paint();
  }));
}

function renderRows() {
  const links = flat().filter(match);
  const tbody = document.getElementById("rows");
  const empty = document.getElementById("empty");
  let title = "All bookmarks";
  if (state.starred) title = "Starred";
  else if (state.cat) {
    const [pi, ci] = state.cat.split(":").map(Number);
    title = DATA[pi].categories[ci].name;
  } else if (state.pillar !== "all") title = state.pillar;
  document.getElementById("title").innerHTML = esc(title) + ' <span class="count">(' + links.length + ")</span>";
  if (!links.length) {
    tbody.innerHTML = "";
    empty.hidden = false;
    return;
  }
  empty.hidden = true;
  tbody.innerHTML = links.map(l => {
    const starred = state.favs.has(l.url);
    const src = favicon(l.host, l.url);
    return `<tr>
      <td><div class="name-cell">${src ? `<img src="${esc(src)}" alt="" width="16" height="16" loading="lazy">` : ""}<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.name)}</a></div></td>
      <td class="blurb">${esc(l.blurb || "")}</td>
      <td class="url"><a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.host || l.url)}</a></td>
      <td class="kind" title="${esc((KIND_META[l.kind] || {}).tip || "")}">${esc((KIND_META[l.kind] || {}).label || l.kind)}</td>
      <td><button type="button" class="star ${starred ? "on" : ""}" data-url="${esc(l.url)}" aria-label="${starred ? "Unstar" : "Star"} ${esc(l.name)}" aria-pressed="${starred ? "true" : "false"}">${starred ? "★" : "☆"}</button></td>
    </tr>`;
  }).join("");
}

function setStatus(msg) {
  const el = document.getElementById("status");
  if (el) el.textContent = msg;
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 2600);
}

function paint() {
  renderFolders();
  renderRows();
  const starredBtn = document.getElementById("starredBtn");
  starredBtn.classList.toggle("on", state.starred);
  starredBtn.setAttribute("aria-pressed", state.starred ? "true" : "false");
}

document.getElementById("rows").addEventListener("click", e => {
  const btn = e.target.closest(".star");
  if (!btn) return;
  const url = btn.dataset.url;
  if (state.favs.has(url)) state.favs.delete(url);
  else state.favs.add(url);
  saveFavs();
  paint();
});

document.getElementById("q").addEventListener("input", e => {
  state.q = e.target.value;
  renderRows();
});

document.getElementById("starredBtn").addEventListener("click", () => {
  state.starred = !state.starred;
  paint();
});

function typingTarget(el) {
  if (!el) return false;
  const tag = el.tagName;
  return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || el.isContentEditable;
}

function exportStars() {
  const byUrl = new Map(flat().map(l => [l.url, l]));
  const items = [...state.favs].map(url => {
    const hit = byUrl.get(url);
    return hit
      ? { url, name: hit.name, host: hit.host, blurb: hit.blurb, pillar: hit.pillar, category: hit.category }
      : { url };
  });
  const payload = {
    version: 1,
    exportedAt: new Date().toISOString(),
    source: "cti-bookmarks-console",
    count: items.length,
    stars: items,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "cti-starred-bookmarks.json";
  a.click();
  URL.revokeObjectURL(a.href);
  toast(`Exported ${items.length} starred bookmark${items.length === 1 ? "" : "s"}`);
}

function importStars(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      let urls = [];
      if (Array.isArray(data)) urls = data;
      else if (Array.isArray(data.stars)) {
        urls = data.stars.map(s => (typeof s === "string" ? s : s && s.url)).filter(Boolean);
      } else if (Array.isArray(data.urls)) urls = data.urls;
      else throw new Error("JSON must include a stars[] or urls[] array");
      const before = state.favs.size;
      urls.forEach(u => { if (typeof u === "string" && u) state.favs.add(u); });
      saveFavs();
      paint();
      toast(`Imported ${state.favs.size - before} new star${state.favs.size - before === 1 ? "" : "s"} (${state.favs.size} total)`);
    } catch (err) {
      toast("Import failed: " + (err.message || "invalid JSON"));
    }
  };
  reader.readAsText(file);
}

document.getElementById("exportBtn").addEventListener("click", exportStars);
document.getElementById("importBtn").addEventListener("click", () => document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change", e => {
  const file = e.target.files && e.target.files[0];
  if (file) importStars(file);
  e.target.value = "";
});

(function initHelp() {
  const pop = document.getElementById("helpPop");
  const open = () => { pop.hidden = false; pop.classList.add("open"); document.getElementById("helpClose").focus(); };
  const close = () => { pop.hidden = true; pop.classList.remove("open"); };
  document.getElementById("helpBtn").addEventListener("click", open);
  document.getElementById("helpClose").addEventListener("click", close);
  pop.addEventListener("click", e => { if (e.target === pop) close(); });
  window.__csbHelp = { open, close, isOpen: () => pop.classList.contains("open") };
})();

(function initKindFilter() {
  const sel = document.getElementById("kindFilter");
  const counts = Object.fromEntries(KIND_ORDER.map(k => [k, 0]));
  flat().forEach(l => { if (counts[l.kind] != null) counts[l.kind]++; });
  KIND_ORDER.forEach(k => {
    const m = KIND_META[k];
    const opt = document.createElement("option");
    opt.value = k;
    opt.textContent = `${m.label} (${counts[k]})`;
    opt.title = m.tip;
    sel.appendChild(opt);
  });
  sel.addEventListener("change", () => {
    state.kind = sel.value;
    renderRows();
  });
})();

(function initTheme() {
  const KEY = "csb-theme";
  const btn = document.getElementById("themeBtn");
  function current() {
    const saved = localStorage.getItem(KEY);
    if (saved === "light" || saved === "dark") return saved;
    return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function apply(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem(KEY, theme);
    btn.textContent = theme === "dark" ? "Light" : "Dark";
    btn.title = theme === "dark" ? "Switch to light theme (d)" : "Switch to dark theme (d)";
  }
  apply(current());
  btn.addEventListener("click", () => {
    apply(current() === "dark" ? "light" : "dark");
  });
  window.__csbThemeToggle = () => apply(current() === "dark" ? "light" : "dark");
})();

document.addEventListener("keydown", e => {
  const q = document.getElementById("q");
  const help = window.__csbHelp;

  if (e.key === "Escape") {
    if (help && help.isOpen()) { help.close(); return; }
    if (document.activeElement === q || state.q) {
      state.q = "";
      q.value = "";
      q.blur();
      renderRows();
    }
    return;
  }

  if (e.key === "/" && !typingTarget(document.activeElement)) {
    e.preventDefault();
    q.focus();
    q.select();
    return;
  }

  if (typingTarget(document.activeElement) || e.ctrlKey || e.metaKey || e.altKey) return;

  if (e.key === "?" || (e.shiftKey && e.key === "/")) {
    e.preventDefault();
    if (help) help.open();
    return;
  }
  if (e.key === "d" || e.key === "D") {
    e.preventDefault();
    if (window.__csbThemeToggle) window.__csbThemeToggle();
    return;
  }
  if (e.key === "s" || e.key === "S") {
    e.preventDefault();
    state.starred = !state.starred;
    paint();
  }
});

const _renderRows = renderRows;
renderRows = function () {
  _renderRows();
  const n = flat().filter(match).length;
  setStatus(`${n} bookmark${n === 1 ? "" : "s"} shown`);
};

paint();
</script>
</body>
</html>
